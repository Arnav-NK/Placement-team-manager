<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Fair Eligibility Shortlist</title>
  <style>
    :root {
      --bg-color: #f9fafb;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --success-color: #059669;
      --success-bg: #d1fae5;
      --error-color: #dc2626;
      --error-bg: #fee2e2;
      --input-border: #d1d5db;
      --focus-ring: rgba(37, 99, 235, 0.3);
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.5;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* Header */
    .header {
      grid-column: 1 / -1;
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    /* Panels */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }

    .panel-title {
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.25rem;
    }

    .form-control {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--input-border);
      border-radius: 0.375rem;
      font-size: 0.875rem;
      transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      border-radius: 0.375rem;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      flex: 1;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: white;
      border-color: var(--input-border);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background-color: var(--bg-color);
      color: var(--text-primary);
    }

    .btn-full {
      flex-basis: 100%;
    }

    /* Results Area */
    .validation-banner {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      background-color: var(--error-bg);
      color: var(--error-color);
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(220, 38, 38, 0.2);
    }

    .validation-banner.active {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .results-summary {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    /* Role Cards */
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .role-card {
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      padding: 1rem;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
    }

    .role-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }

    .role-title-wrap {
      display: flex;
      flex-direction: column;
    }

    .role-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .role-id {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: monospace;
    }

    .badge {
      padding: 0.25rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-eligible {
      background-color: var(--success-bg);
      color: var(--success-color);
    }

    .badge-ineligible {
      background-color: var(--error-bg);
      color: var(--error-color);
    }

    .failure-reasons {
      margin-top: 0.5rem;
      padding-left: 1.5rem;
      font-size: 0.875rem;
      color: var(--error-color);
      margin-bottom: 0;
    }

    .failure-reasons li {
      margin-bottom: 0.25rem;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdn.remoat.dev/promoter/remoat-promoter.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Career Fair Eligibility Shortlist</h1>
    </div>

    <div class="panel">
      <h2 class="panel-title">Student Profile</h2>

      <div class="form-group">
        <label for="branch">Branch</label>
        <input type="text" id="branch" class="form-control" placeholder="e.g. CSE">
      </div>

      <div class="form-group">
        <label for="cgpa">CGPA (0-10)</label>
        <input type="number" id="cgpa" class="form-control" step="0.1" min="0" max="10">
      </div>

      <div class="form-group">
        <label for="gradYear">Graduation Year</label>
        <input type="number" id="gradYear" class="form-control">
      </div>

      <div class="form-group">
        <label for="backlogs">Active Backlogs</label>
        <input type="number" id="backlogs" class="form-control" min="0">
      </div>

      <div class="form-group">
        <label for="skills">Skills (comma-separated)</label>
        <input type="text" id="skills" class="form-control" placeholder="Git, Python, SQL">
      </div>

      <div class="actions">
        <button id="btnEvaluate" class="btn btn-primary btn-full">Evaluate Eligibility</button>
        <button id="btnLoadSample" class="btn btn-secondary">Load Sample</button>
        <button id="btnReset" class="btn btn-secondary">Reset</button>
      </div>
    </div>

    <div class="panel">
      <div class="results-header">
        <h2 class="panel-title" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">Evaluation Results
        </h2>
        <div id="resultsSummary" class="results-summary"></div>
      </div>

      <div id="validationBanner" class="validation-banner"></div>

      <div id="resultsList" class="results-list">
        <!-- Results will be injected here -->
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
